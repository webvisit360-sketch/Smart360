        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaInput"
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaEntry"
  /admin/storage/usage:
    get:
      operationId: getStorageUsage
      tags: [media]
      description: >
        Object-storage usage per tenant (sum of stored media object sizes),
        largest first, plus the total across all tenants. Values refresh at
        most every few minutes (server-side cache).
      responses:
        "200":
          description: Usage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageUsage"
  /admin/storage/cleanup:
    get:
      operationId: getStorageCleanupPreview
      tags: [media]
      description: >
        DRY RUN of the explicit storage cleanup — lists files no DB row
        references any more (across ALL tenants, so duplicated tenants keep
        each other's files alive) without touching anything. scope=tenant
        needs tenantId and scans that tenant's slug prefixes; scope=orphans
        scans prefixes belonging to no live tenant.
      parameters:
        - name: scope
          in: query
          required: true
          schema: { type: string, enum: [tenant, orphans] }
        - name: tenantId
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: What would be removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageCleanupPreview"
    post:
      operationId: runStorageCleanup
      tags: [media]
      description: >
        Execute the cleanup for the same scope. References are re-computed at
        execution time; files that gained a reference since the preview are
        skipped. Never runs on a schedule — admin-confirmed only. Files are
        MOVED to a 30-day trash (never hard-deleted) and every run writes an
        audit record. Allowed only in production — the bucket is shared with
        development while databases are separate, so a dev run would compute
        "unused" from the wrong database (403 outside production).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StorageCleanupRequest"
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageCleanupResult"
        "403":
          description: Cleanup execution is disabled outside production
  /admin/storage/cleanup/runs:
    get:
      operationId: listCleanupRuns
      tags: [media]
      description: >
        Audit list of past cleanup runs (who, when, scope, files with sizes)
        including trash state — restorable files stay in trash 30 days.
      responses:
        "200":
          description: Runs, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CleanupRunsResult"
  /admin/storage/cleanup/restore:
    post:
      operationId: restoreCleanupFiles
      tags: [media]
      description: >
        Restore files of a cleanup run from trash back to their original
        locations. Omitting key restores the whole run.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CleanupRestoreRequest"
      responses:
        "200":
          description: Restore result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CleanupRestoreResult"
        "404":
          description: Run not found
        "410":
          description: Trash already purged (older than 30 days)
  # NOTE: POST /admin/items/{id}/media/upload (multipart photo/video upload)
