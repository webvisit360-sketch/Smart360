        statusNote: { type: ["string", "null"] }
        createdAt: { type: string }
        updatedAt: { type: string }
      required: [orderRef, tenantId, itemId, qty, guestName, guestPhone, guestUnit, status, statusNote, createdAt, updatedAt]
