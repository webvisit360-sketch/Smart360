openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Smart360 API - multi-tenant guest information PWA
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: public
  - name: auth
  - name: tenants
  - name: sections
  - name: categories
  - name: items
  - name: media
  - name: translations
  - name: overview
  - name: orders
  - name: messages
  - name: site-plan
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /public/tenants/{slug}:
    get:
      operationId: getPublicTenant
      tags: [public]
      summary: Full published content tree for a tenant (guest view)
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
        - name: lang
          in: query
          required: false
          schema: { type: string }
        - name: preview
          in: query
          required: false
          schema: { type: boolean }
      responses:
        "200":
          description: Tenant content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantContent"
        "404":
          description: Not found or unpublished
  /public/tenants/{slug}/search:
    get:
      operationId: searchPublicTenant
      tags: [public]
      summary: Full-text search across a tenant's visible content
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
        - name: q
          in: query
          required: true
          schema: { type: string }
        - name: lang
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SearchResult"
  /admin/webauthn/login/options:
    post:
      operationId: getPasskeyLoginOptions
      tags: [auth]
      responses:
        "200":
          description: WebAuthn authentication options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebAuthnOptions"
        "429":
          description: Too many attempts
  /admin/webauthn/login/verify:
    post:
      operationId: verifyPasskeyLogin
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebAuthnVerifyBody"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
        "401":
          description: Verification failed
        "429":
          description: Too many attempts
  /admin/enroll/options:
    post:
      operationId: getEnrollOptions
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrollOptionsBody"
      responses:
        "200":
          description: WebAuthn registration options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebAuthnOptions"
        "400":
          description: Invalid or expired token
  /admin/enroll/verify:
    post:
      operationId: verifyEnroll
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrollVerifyBody"
      responses:
        "200":
          description: Passkey registered; recovery codes when first enrolment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollResult"
        "400":
          description: Invalid request
  /admin/recovery:
    post:
      operationId: useRecoveryCode
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecoveryBody"
      responses:
        "200":
          description: Enrolment token issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryResult"
        "401":
          description: Invalid code
        "429":
          description: Too many attempts
  /admin/credentials:
    get:
      operationId: listPasskeys
      tags: [auth]
      responses:
        "200":
          description: Registered passkeys
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasskeyList"
        "401":
          description: Not authenticated
  /admin/credentials/{id}:
    patch:
      operationId: renamePasskey
      tags: [auth]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenamePasskeyRequest"
      responses:
        "200":
          description: Renamed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkStatus"
        "404":
          description: Not found
    delete:
      operationId: deletePasskey
      tags: [auth]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkStatus"
        "400":
          description: Cannot delete the last credential
        "404":
          description: Not found
  /admin/credentials/options:
    post:
      operationId: getAddPasskeyOptions
      tags: [auth]
      responses:
        "200":
          description: WebAuthn registration options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebAuthnOptions"
        "401":
          description: Not authenticated
  /admin/credentials/verify:
    post:
      operationId: verifyAddPasskey
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddPasskeyVerifyBody"
      responses:
        "200":
          description: Passkey added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkStatus"
        "400":
          description: Invalid request
  /admin/sessions/revoke-all:
    post:
      operationId: revokeAllSessions
      tags: [auth]
      responses:
        "200":
          description: All sessions revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkStatus"
        "401":
          description: Not authenticated
  /admin/recovery-codes:
    get:
      operationId: getRecoveryCodeStatus
      tags: [auth]
      responses:
        "200":
          description: Recovery code counts (never the values)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryCodeStatus"
        "401":
          description: Not authenticated
  /admin/recovery-codes/rotate:
    post:
      operationId: rotateRecoveryCodes
      tags: [auth]
      responses:
        "200":
          description: Fresh set of recovery codes, shown exactly once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryCodesRotated"
        "401":
          description: Not authenticated
  /admin/auth-events:
    get:
      operationId: listAuthEvents
      tags: [auth]
      responses:
        "200":
          description: Recent authentication audit events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthEventList"
        "401":
          description: Not authenticated
  /admin/logout:
    post:
      operationId: adminLogout
      tags: [auth]
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
  /admin/session:
    get:
      operationId: getAdminSession
      tags: [auth]
      responses:
        "200":
          description: Session state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
  /admin/overview:
    get:
      operationId: getAdminOverview
      tags: [overview]
      summary: Dashboard counts and recent changes
      responses:
        "200":
          description: Overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOverview"
  /admin/cutovers/part-5-meli-pu:
    get:
      operationId: getPart5MeliPuCutoverPreflight
      tags: [cutovers]
      summary: Read-only PART 5 preflight for the approved Meli Pu ledger
      responses:
        "200":
          description: Current schema, owner-gate, and content-manifest state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Part5MeliPuCutoverPreflight"
        "409":
          description: Required schema or tenant state is unavailable
    post:
      operationId: applyPart5MeliPuCutover
      tags: [cutovers]
      summary: Apply the approved PART 5 Meli Pu ledger exactly once
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Part5MeliPuCutoverApplyInput"
      responses:
        "200":
          description: Atomic ledger application completed and post-hashes matched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Part5MeliPuCutoverResult"
        "400":
          description: Invalid confirmation body
        "409":
          description: Any schema, hash, row, or owner-gate precondition mismatched
  /admin/tenants:
    get:
      operationId: listTenants
      tags: [tenants]
      responses:
        "200":
          description: Tenants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tenant"
    post:
      operationId: createTenant
      tags: [tenants]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
  /admin/tenants/overview:
    get:
      operationId: listTenantOverview
      tags: [tenants]
      summary: Owner cockpit — readiness and pending work per tenant
      responses:
        "200":
          description: Overview rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TenantOverview"
  /admin/tenants/{id}/changelog:
    get:
      operationId: listTenantChangelog
      tags: [tenants]
      summary: Per-tenant changelog with actor attribution
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Changelog entries, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChangelogEntry"
  /admin/tenants/{id}:
    get:
      operationId: getTenant
      tags: [tenants]
      summary: Tenant with full content tree
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Tenant content tree
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantContent"
        "404":
          description: Not found
    patch:
      operationId: updateTenant
      tags: [tenants]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
    delete:
      operationId: deleteTenant
      tags: [tenants]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted
  /admin/tenants/{id}/distance-review:
    get:
      operationId: getDistanceReview
      tags: [tenants]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: Distance review rows
          content: { application/json: { schema: { $ref: "#/components/schemas/DistanceReview" } } }
    post:
      operationId: runDistanceReview
      tags: [tenants]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        content: { application/json: { schema: { $ref: "#/components/schemas/DistanceRunInput" } } }
      responses:
        "200":
          description: Computation progress
          content: { application/json: { schema: { $ref: "#/components/schemas/DistanceRunResult" } } }
  /admin/tenants/{id}/distance-review/approve-bulk:
    post:
      operationId: approveDistanceReviewBulk
      tags: [tenants]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/DistanceBulkApproveInput" } } }
      responses:
        "200": { description: Approved, content: { application/json: { schema: { $ref: "#/components/schemas/DistanceReview" } } } }
  /admin/tenants/{id}/distance-review/rows/{rowId}/approve:
    post:
      operationId: approveDistanceReviewRow
      tags: [tenants]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }, { name: rowId, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Approved, content: { application/json: { schema: { $ref: "#/components/schemas/DistanceReviewRow" } } } }
  /admin/tenants/{id}/distance-review/rows/{rowId}/skip:
    post:
      operationId: skipDistanceReviewRow
      tags: [tenants]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }, { name: rowId, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Skipped, content: { application/json: { schema: { $ref: "#/components/schemas/DistanceReviewRow" } } } }
  /admin/tenants/{id}/distance-review/rows/{rowId}/value:
    post:
      operationId: setDistanceReviewRowValue
      tags: [tenants]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }, { name: rowId, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/DistanceValueInput" } } }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/DistanceReviewRow" } } } }
  /admin/tenants/{id}/distance-review/rows/{rowId}/link:
    post:
      operationId: setDistanceReviewRowLink
      tags: [tenants]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }, { name: rowId, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/DistanceLinkInput" } } }
      responses:
        "200": { description: Recomputed, content: { application/json: { schema: { $ref: "#/components/schemas/DistanceReviewRow" } } } }
  /admin/tenants/{id}/distance-review/rows/{rowId}/revert:
    post:
      operationId: revertDistanceReviewRow
      tags: [tenants]
      summary: Undo an approve/edit/skip decision, returning the row to pending review
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }, { name: rowId, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Reverted, content: { application/json: { schema: { $ref: "#/components/schemas/DistanceReviewRow" } } } }
  /admin/tenants/{id}/duplicate:
    post:
      operationId: duplicateTenant
      tags: [tenants]
      summary: Duplicate a tenant with its full section/category tree
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantDuplicateInput"
      responses:
        "201":
          description: Duplicated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DuplicateTenantResult"
  /admin/tenants/{id}/renew:
    post:
      operationId: renewTenant
      tags: [tenants]
      summary: >
        "Obnovljeno za eno leto" — moves renewsAt forward exactly one year from
        its CURRENT value (never from today: a late payer must not gain weeks).
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Renewed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "404":
          description: Not found
  /admin/tenants/{id}/renewals:
    get:
      operationId: listTenantRenewals
      tags: [tenants]
      summary: Renewal history — proof of when a renewal was recorded
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: History, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RenewalEntry"
  /admin/tenants/{id}/media-check:
    get:
      operationId: checkTenantMedia
      tags: [tenants]
      description: >
        Consistency check ("Preveri datoteke"): every media reference of this
        tenant whose file is missing from storage, has the wrong content type
        for the field, or lacks transparency where the transparent logo is
        required. Read-only.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Issues found (empty list = clean)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaCheckResult"
  /admin/tenants/{id}/site-plan-images:
    get:
      operationId: listSitePlanImages
      tags: [site-plan]
      summary: List all site-plan images for a tenant, ordered by position
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Ordered site-plan images
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SitePlanImage"
        "404":
          description: Tenant not found
  /admin/tenants/{id}/site-plan-images/reorder:
    post:
      operationId: reorderSitePlanImages
      tags: [site-plan]
      summary: Reorder site-plan images by providing the full ordered list of IDs
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderInput"
      responses:
        "200":
          description: Reordered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkStatus"
        "400":
          description: Validation error (wrong ids, wrong ownership, item-scoped row)
        "404":
          description: Tenant not found
  /admin/site-plan-images/{id}:
    patch:
      operationId: updateSitePlanImage
      tags: [site-plan]
      summary: Update the caption of a site-plan image
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SitePlanImageUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SitePlanImage"
        "400":
          description: Not a site-plan image
        "404":
          description: Not found
    delete:
      operationId: deleteSitePlanImage
      tags: [site-plan]
      summary: Delete a site-plan image and clean up storage objects
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted
        "400":
          description: Not a site-plan image
        "404":
          description: Not found
  # NOTE: POST /admin/tenants/{id}/site-plan-images/upload (multipart upload)
  # intentionally lives OUTSIDE this contract, matching the item upload convention.
  # It accepts FormData with a single "file" field, image-only.
  /admin/tenants/{id}/sections:
    post:
      operationId: createSection
      tags: [sections]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SectionInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Section"
  /admin/sections/{id}:
    patch:
      operationId: updateSection
      tags: [sections]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SectionUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Section"
    delete:
      operationId: deleteSection
      tags: [sections]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted
  /admin/sections/reorder:
    post:
      operationId: reorderSections
      tags: [sections]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderInput"
      responses:
        "200":
          description: Reordered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkStatus"
  /admin/sections/{id}/categories:
    post:
      operationId: createCategory
      tags: [categories]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
  /admin/categories/{id}:
    patch:
      operationId: updateCategory
      tags: [categories]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
    delete:
      operationId: deleteCategory
      tags: [categories]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted
  /admin/categories/reorder:
    post:
      operationId: reorderCategories
      tags: [categories]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderInput"
      responses:
        "200":
          description: Reordered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkStatus"
  /admin/categories/{id}/items:
    post:
      operationId: createItem
      tags: [items]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
  /admin/items/{id}:
    patch:
      operationId: updateItem
      tags: [items]
      summary: Update an item; pass categoryId to move it to another category
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
    delete:
      operationId: deleteItem
      tags: [items]
      parameters:
        - name: id
          in: path
          required: true
