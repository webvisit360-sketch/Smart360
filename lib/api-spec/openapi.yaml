    OrderInput:
      type: object
      description: Body for placing a new order
      properties:
        itemId:
          type: string
          description: UUID of the item to order
        qty:
          type: number
          minimum: 1
          maximum: 999
          description: Quantity (positive integer 1-999); must be a whole number
        guestName:
          type: string
          maxLength: 200
          description: Guest name (required after whitespace trimming)
        guestPhone:
          type: string
          minLength: 1
          maxLength: 50
          description: Guest phone number (required; must contain at least six digit characters; formatting is preserved)
        guestUnit:
          type: string
          minLength: 1
          maxLength: 100
          description: Guest accommodation/unit pre-filled from sign-in but editable (e.g. "B-14")
        guestNote:
          type: string
          maxLength: 500
          description: Optional guest note
        orderPassword:
          type: string
          maxLength: 200
          description: Required only when the tenant has configured an order password; compared after trimming and remains case-sensitive
        lang:
          type: string
          enum: [sl, en, de, it]
          description: UI language used for localized order validation errors; defaults to sl
      required: [itemId, qty, guestName, guestPhone, guestUnit]
    OrderStatusUpdate:
      type: object
      description: Body for patching order status and replacing the current host note
      properties:
        status:
          type: string
          enum: [potrjeno, prevzeto, zavrnjeno]
          description: Target status (only non-terminal targets are valid per the transition matrix)
        statusNote:
          type: ["string", "null"]
          maxLength: 300
          description: Optional plain-text note for the target status; omitted, null, or blank clears the previous status note
      required: [status]
    OrderPublic:
