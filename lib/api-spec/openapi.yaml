      responses:
        "200":
          description: Reordered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkStatus"
  /admin/items/{id}/media:
    post:
      operationId: addItemMedia
      tags: [media]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
