openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Smart360 API - multi-tenant guest information PWA
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: public
  - name: auth
  - name: tenants
  - name: sections
  - name: categories
  - name: items
  - name: media
  - name: translations
  - name: overview
  - name: orders
  - name: messages
  - name: site-plan
paths:
  /public/enquiries:
    post:
      operationId: sendPublicEnquiry
      tags: [public]
      summary: Capture a public sales enquiry and notify the owner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicEnquiry"
      responses:
        "200":
          description: Enquiry safely captured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicEnquiryResponse"
        "400":
          description: Invalid input
        "429":
          description: Rate limited
        "503":
          description: Enquiry could not be safely captured
  /admin/enquiries:
    get:
      operationId: listAdminEnquiries
      tags: [overview]
      summary: List captured sales enquiries, newest first
      responses:
        "200":
          description: Captured enquiries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminEnquiry"
        "401":
          description: Not authenticated
  /admin/tenants/{id}/host:
    get:
      operationId: getAdminTenantHostAccount
      tags: [tenants]
      summary: Read the owner-visible host account and latest invitation delivery evidence
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Host account, without credentials or invite tokens
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostAccountResponse"
        "401":
          description: Not authenticated
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /public/tenants/{slug}:
    get:
      operationId: getPublicTenant
      tags: [public]
      summary: Full published content tree for a tenant (guest view)
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
        - name: lang
          in: query
          required: false
          schema: { type: string }
        - name: preview
          in: query
          required: false
          schema: { type: boolean }
      responses:
        "200":
          description: Tenant content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantContent"
        "404":
          description: Not found or unpublished
  /public/tenants/{slug}/search:
    get:
      operationId: searchPublicTenant
      tags: [public]
      summary: Full-text search across a tenant's visible content
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
        - name: q
          in: query
          required: true
          schema: { type: string }
        - name: lang
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SearchResult"
  /admin/webauthn/login/options:
    post:
      operationId: getPasskeyLoginOptions
      tags: [auth]
      responses:
        "200":
          description: WebAuthn authentication options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebAuthnOptions"
        "429":
          description: Too many attempts
  /admin/password/login:
    post:
      operationId: loginAdminPassword
      tags: [auth]
      summary: Primary operator e-mail and password login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminPasswordLoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
        "400":
          description: Password exceeds the maximum length
        "401":
          description: Invalid credentials or progressive delay active
        "429":
          description: Five failed password verifications from this IP in 15 minutes
  /admin/password:
    get:
      operationId: getAdminPasswordStatus
      tags: [auth]
      responses:
        "200":
          description: Whether the operator credential is configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPasswordStatus"
        "401":
          description: Not authenticated
    put:
      operationId: setAdminPassword
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminPasswordUpdate"
      responses:
        "200":
          description: Password set or changed and other sessions revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkStatus"
        "400":
          description: Invalid new password, wrong current password, or concurrent change
        "401":
          description: Not authenticated
  /admin/webauthn/login/verify:
    post:
      operationId: verifyPasskeyLogin
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebAuthnVerifyBody"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
        "401":
          description: Verification failed
        "429":
          description: Too many attempts
  /admin/enroll/options:
    post:
      operationId: getEnrollOptions
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrollOptionsBody"
      responses:
        "200":
          description: WebAuthn registration options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebAuthnOptions"
        "400":
          description: Invalid or expired token
  /admin/enroll/verify:
    post:
      operationId: verifyEnroll
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrollVerifyBody"
      responses:
        "200":
          description: Passkey registered; recovery codes when first enrolment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollResult"
        "400":
          description: Invalid request
  /admin/recovery:
    post:
      operationId: useRecoveryCode
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecoveryBody"
      responses:
        "200":
          description: Recovery code consumed, password reset, and fresh operator session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryResult"
        "401":
          description: Invalid code
        "429":
          description: Too many attempts
  /admin/credentials:
    get:
      operationId: listPasskeys
      tags: [auth]
      responses:
        "200":
          description: Registered passkeys
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasskeyList"
        "401":
          description: Not authenticated
  /admin/credentials/{id}:
    patch:
      operationId: renamePasskey
      tags: [auth]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenamePasskeyRequest"
      responses:
        "200":
          description: Renamed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkStatus"
        "404":
          description: Not found
    delete:
      operationId: deletePasskey
      tags: [auth]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkStatus"
        "400":
          description: Cannot delete the last credential
        "404":
          description: Not found
  /admin/credentials/options:
    post:
      operationId: getAddPasskeyOptions
      tags: [auth]
      responses:
        "200":
          description: WebAuthn registration options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebAuthnOptions"
        "401":
          description: Not authenticated
  /admin/credentials/verify:
    post:
      operationId: verifyAddPasskey
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddPasskeyVerifyBody"
      responses:
        "200":
          description: Passkey added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkStatus"
        "400":
          description: Invalid request
  /admin/sessions/revoke-all:
    post:
      operationId: revokeAllSessions
      tags: [auth]
      responses:
        "200":
          description: All sessions revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSessionRevocationResult"
        "401":
          description: Not authenticated
  /admin/sessions/status:
    get:
      operationId: getAdminSessionsStatus
      tags: [auth]
      responses:
        "200":
          description: Number of currently active owner sessions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSessionsStatus"
        "401":
          description: Not authenticated
  /admin/recovery-codes:
    get:
      operationId: getRecoveryCodeStatus
      tags: [auth]
      responses:
        "200":
          description: Recovery code counts (never the values)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryCodeStatus"
        "401":
          description: Not authenticated
  /admin/recovery-codes/rotate:
    post:
      operationId: rotateRecoveryCodes
      tags: [auth]
      responses:
        "200":
          description: Fresh set of recovery codes, shown exactly once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryCodesRotated"
        "401":
          description: Not authenticated
  /admin/auth-events:
    get:
      operationId: listAuthEvents
      tags: [auth]
      responses:
        "200":
          description: Recent authentication audit events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthEventList"
        "401":
          description: Not authenticated
  /admin/logout:
    post:
      operationId: adminLogout
      tags: [auth]
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
  /admin/session:
    get:
      operationId: getAdminSession
      tags: [auth]
      responses:
        "200":
          description: Session state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
  /admin/overview:
    get:
      operationId: getAdminOverview
      tags: [overview]
      summary: Dashboard counts and recent changes
      responses:
        "200":
          description: Overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOverview"
  /admin/cutovers/part-5-meli-pu:
    get:
      operationId: getPart5MeliPuCutoverPreflight
      tags: [cutovers]
      summary: Read-only PART 5 preflight for the approved Meli Pu ledger
      responses:
        "200":
          description: Current schema, owner-gate, and content-manifest state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Part5MeliPuCutoverPreflight"
        "409":
          description: Required schema or tenant state is unavailable
    post:
      operationId: applyPart5MeliPuCutover
      tags: [cutovers]
      summary: Apply the approved PART 5 Meli Pu ledger exactly once
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Part5MeliPuCutoverApplyInput"
      responses:
        "200":
          description: Atomic ledger application completed and post-hashes matched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Part5MeliPuCutoverResult"
        "400":
          description: Invalid confirmation body
        "409":
          description: Any schema, hash, row, or owner-gate precondition mismatched
  /admin/tenants:
    get:
      operationId: listTenants
      tags: [tenants]
      responses:
        "200":
          description: Tenants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tenant"
    post:
      operationId: createTenant
      tags: [tenants]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
  /admin/tenants/overview:
    get:
      operationId: listTenantOverview
      tags: [tenants]
      summary: Owner cockpit — readiness and pending work per tenant
      responses:
        "200":
          description: Overview rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TenantOverview"
  /admin/creator/origin-preview:
    post:
      operationId: previewCreatorOrigin
      tags: [tenants]
      summary: Parse and reverse-geocode a Google Maps origin without saving it
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatorOriginPreviewInput"
      responses:
        "200":
          description: Unsaved origin preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatorOriginPreview"
        "400": { description: Missing or invalid request }
        "422": { description: Google Maps link cannot provide a safe pin }
        "502": { description: Reverse geocoding failed }
  /admin/tenants/{id}/creator/origin:
    post:
      operationId: confirmCreatorTenantOrigin
      tags: [tenants]
      summary: Re-parse and save a confirmed Maps origin onto the open cockpit tenant
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmCreatorTenantOriginInput"
      responses:
        "200":
          description: Updated cockpit tenant origin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatorTenantOrigin"
        "400": { description: Invalid origin details }
        "404": { description: Cockpit tenant not found }
        "409": { description: Existing origin requires explicit replacement }
        "422": { description: Google Maps link cannot provide a safe pin }
        "502": { description: Reverse geocoding failed }
  /admin/tenants/{id}/creator/runs:
    post:
      operationId: startCreatorRun
      tags: [tenants]
      summary: Start the approved municipality source-first pipeline asynchronously
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "202":
          description: Source-first run accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatorSourceRun"
        "400": { description: Source list has proposed entries or no approved sources }
        "404": { description: Tenant not found }
        "409": { description: Source list was not explicitly approved or a run is in progress }
  /admin/tenants/{id}/creator/sources:
    get:
      operationId: listCreatorSources
      tags: [tenants]
      summary: List the tenant municipality source ledger, including blocked rows
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Municipality source ledger
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatorSourceList"
        "404": { description: Tenant or municipality not found }
    post:
      operationId: proposeCreatorSources
      tags: [tenants]
      summary: Propose source URLs without fetching content pages
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatorSourceProposalListInput"
      responses:
        "200":
          description: Updated municipality source ledger
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CreatorSource"
        "400": { description: "Invalid label, kind, or URL" }
        "404": { description: Tenant or municipality not found }
  /admin/tenants/{id}/creator/sources/{sourceId}:
    patch:
      operationId: editCreatorSource
      tags: [tenants]
      summary: Edit a proposed or revoked source and return it to proposed
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: sourceId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatorSourceEditInput"
      responses:
        "200":
          description: Edited source
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatorSource" }
        "409": { description: Source cannot be edited }
    delete:
      operationId: deleteCreatorSource
      tags: [tenants]
      summary: Delete a proposed or revoked source without deleting fetched evidence
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: sourceId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Source removed from the ledger
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatorSourceDeleteResult" }
        "409": { description: Completed-run provenance cannot be deleted }
  /admin/tenants/{id}/creator/sources/{sourceId}/archive:
    post:
      operationId: archiveCreatorSource
      tags: [tenants]
      summary: Archive a revoked completed-run provenance source
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: sourceId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Archived source
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatorSource" }
        "409": { description: Source cannot be archived }
  /admin/tenants/{id}/creator/sources/approve-list:
    post:
      operationId: approveCreatorSourceList
      tags: [tenants]
      summary: Explicitly approve the fully decided current municipality list
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: List approval recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatorSourceListApproval"
        "400": { description: Proposed entries remain or no approved sources exist }
        "404": { description: Tenant or municipality not found }
  /admin/tenants/{id}/creator/sources/{sourceId}/{decision}:
    post:
      operationId: decideCreatorSource
      tags: [tenants]
      summary: Approve, reject, or revoke one municipality source
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: sourceId
          in: path
          required: true
          schema: { type: string }
        - name: decision
          in: path
          required: true
          schema: { type: string, enum: [approve, reject, revoke] }
      responses:
        "200":
          description: Updated source
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatorSource"
        "400": { description: Invalid transition }
        "404": { description: Tenant municipality or source not found }
  /admin/tenants/{id}/creator/runs/latest:
    get:
      operationId: getLatestCreatorRun
      tags: [tenants]
      summary: Read the latest Creator run report
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Latest Creator run report, or null before the first run
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/CreatorSourceRun"
                  - type: "null"
        "404": { description: Tenant not found }
  /admin/tenants/{id}/creator/proposals:
    get:
      operationId: listCreatorProposals
      tags: [tenants]
      summary: List the owner-only Creator confirmation queue
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Creator proposals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CreatorProposal"
  /admin/tenants/{id}/creator/photos/discover:
    post:
      operationId: discoverCreatorPhotos
      tags: [tenants]
      summary: Discover free Wikimedia Commons photos for active materialized places without media
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Per-place Wikimedia discovery report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatorPhotoDiscoveryReport" }
        "404": { description: Tenant not found }
        "502": { description: Wikimedia or OpenStreetMap request failed }
  /admin/tenants/{id}/creator/photo-proposals:
    get:
      operationId: listCreatorPhotoProposals
      tags: [tenants]
      summary: List permanent Creator Wikimedia photo review records
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Photo proposal ledger
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CreatorPhotoProposal" }
  /admin/tenants/{id}/creator/photo-proposals/{photoProposalId}/approve:
    post:
      operationId: approveCreatorPhotoProposal
      tags: [tenants]
      summary: Validate, copy, and approve a Wikimedia photo as ordinary provisional media
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: photoProposalId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Approved proposal and created media
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatorPhotoApproval" }
        "404": { description: Pending proposal not found }
        "422": { description: "Commons attribution, source, or image validation failed" }
  /admin/tenants/{id}/creator/photo-proposals/{photoProposalId}/reject:
    post:
      operationId: rejectCreatorPhotoProposal
      tags: [tenants]
      summary: Permanently reject a Wikimedia photo proposal
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: photoProposalId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatorPhotoRejectionInput" }
      responses:
        "200":
          description: Rejected proposal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatorPhotoProposal" }
        "404": { description: Pending proposal not found }
  /admin/tenants/{id}/creator/proposals/reevaluate:
    post:
      operationId: reevaluateCreatorProposals
      tags: [tenants]
      summary: Re-evaluate the open Creator queue and backfill approved guest items
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Idempotent reevaluation counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatorQueueReevaluationResult"
        "404": { description: Tenant not found }
  /admin/tenants/{id}/creator/catalogue:
    get:
      operationId: listCreatorCategoryOptions
      tags: [tenants]
      summary: List existing tenant categories available to Creator proposals
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Existing category options
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CreatorCategoryOption"
        "404": { description: Tenant not found }
  /admin/tenants/{id}/creator/proposals/{proposalId}:
    patch:
      operationId: editCreatorProposal
      tags: [tenants]
      summary: Edit only human/editorial Creator proposal fields
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: proposalId
