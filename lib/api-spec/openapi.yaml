  /public/tenants/{slug}/orders:
    post:
      operationId: createOrder
      tags: [orders]
      summary: >
        Place an order for an item that has orderEnabled=true. Validates item
        eligibility, tenant published state, phone containing at least six digit
        characters, rate limits, and idempotency. Sends a notification email to
        the tenant only when the tenant's orderNotifyEmail setting is enabled.
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
        - name: x-device-token
          in: header
          required: true
          schema: { type: string, minLength: 16, maxLength: 256 }
          description: Raw device token (opaque, 16-256 chars); hashed server-side, never stored raw
        - name: x-idempotency-key
          in: header
          required: true
          schema: { type: string, minLength: 16, maxLength: 128 }
          description: Required (16-128 chars); unique per order intent; prevents duplicate submissions on retry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
      responses:
        "200":
          description: >
            Idempotent retry of an already accepted order. Returns the existing
            canonical order unchanged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderPublic"
        "201":
          description: Order placed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderPublic"
        "400":
          description: Validation error (item not orderable, sold out, phone has fewer than six digits, etc.)
        "422":
          description: >
            Email notification rejected or sender not configured. A retryable hidden
            order record may persist internally but is not accepted or visible in any
            list until the notification email sends successfully. Retry with the same
            idempotency key to reattempt delivery.
        "425":
          description: >
            Order is currently being processed by another in-flight request (fresh
            pending notification). Retry with the same idempotency key after a
            short delay (suggest 3-5 seconds).
        "429":
          description: Rate limit exceeded
    get:
      operationId: listDeviceOrders
      tags: [orders]
      summary: >
        List orders for the calling device (identified by hashed device token).
        Returns only orders for this tenant and this device — no cross-device data.
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
        - name: x-device-token
          in: header
          required: true
          schema: { type: string }
          description: Raw device token; hashed server-side to look up orders
      responses:
        "200":
          description: Orders for this device and tenant
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrderPublic"
        "400":
          description: Missing device token
  /admin/tenants/{id}/orders:
    get:
      operationId: listTenantOrders
      tags: [orders]
      summary: >
        List all orders for a tenant (admin, newest first).
        Optional query param: ?status=novo|potrjeno|prevzeto|zavrnjeno
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Orders list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrderAdmin"
        "401":
          description: Not authenticated
        "404":
          description: Tenant not found
  /admin/orders/{orderRef}/status:
    patch:
      operationId: updateOrderStatus
      tags: [orders]
      summary: >
        Transition an order status. Allowed transitions:
        novo→potrjeno, novo→zavrnjeno, potrjeno→prevzeto, potrjeno→zavrnjeno.
        Terminal statuses (prevzeto, zavrnjeno) cannot change.
      parameters:
        - name: orderRef
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderStatusUpdate"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderAdmin"
        "400":
          description: Invalid transition
        "401":
          description: Not authenticated
        "404":
          description: Order not found
  /public/tenants/{slug}/messages:
    get:
      operationId: getGuestMessages
      tags: [messages]
      summary: >
        Fetch the active thread and messages for this device.
        Returns only the thread owned by this device token for this tenant.
        Returns 204 when no thread exists yet.
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
        - name: x-device-token
          in: header
          required: true
          schema: { type: string, minLength: 16, maxLength: 256 }
          description: Raw device token; hashed server-side, never stored raw
      responses:
        "200":
          description: Thread with messages for this device
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestThreadView"
        "204":
          description: No thread exists for this device yet
        "400":
          description: Missing or invalid device token
        "404":
          description: Tenant not found
    post:
      operationId: sendGuestMessage
      tags: [messages]
      summary: >
        Send a message as a signed-in guest. A nonblank name and unit are always
        required; the tenant password is also required when configured. Creates
        the thread on first message (one durable thread per tenant + device). All
        attempts, including failed credential checks, count toward the 5/min
        per-IP and 5/min per-device limits.
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
        - name: x-device-token
          in: header
          required: true
          schema: { type: string, minLength: 16, maxLength: 256 }
          description: Raw device token; hashed server-side, never stored raw
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuestMessageInput"
      responses:
        "201":
          description: Message sent; returns the updated thread view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestThreadView"
        "400":
          description: Validation error (body too long, blank, etc.)
        "403":
          description: Invalid guest password
        "404":
          description: Tenant not found or not published
        "409":
          description: Thread is closed — no new guest messages accepted
        "429":
          description: Rate limit exceeded (5/min per IP or per device)
  /admin/tenants/{tenantId}/messages:
    get:
      operationId: listTenantThreads
      tags: [messages]
      summary: List all message threads for a tenant (admin, newest-activity first).
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Thread list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminThreadView"
        "401":
          description: Not authenticated
        "404":
          description: Tenant not found
  /admin/tenants/{tenantId}/messages/{threadRef}:
    post:
      operationId: postHostReply
      tags: [messages]
      summary: Post a host reply into a thread.
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: { type: string }
        - name: threadRef
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HostReplyInput"
      responses:
        "201":
          description: Reply posted; returns updated admin thread view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminThreadView"
        "400":
          description: Validation error
        "401":
          description: Not authenticated
        "404":
          description: Thread or tenant not found
components:
  schemas:
    PublicEnquiry:
      type: object
      additionalProperties: false
      required: [name, email, propertyName, address, propertyType]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        email: { type: string, maxLength: 254 }
        propertyName: { type: string, minLength: 2, maxLength: 160 }
        address: { type: string, minLength: 3, maxLength: 240 }
        propertyType:
          type: string
          enum: [Apartma, Hiša do 6 enot, Kamp, Hotel]
        message: { type: string, maxLength: 2000 }
        website: { type: string, maxLength: 200 }
    PublicEnquiryResponse:
      type: object
      required: [sent]
      properties:
        sent: { type: boolean }
    AdminEnquiry:
      type: object
      required:
        - id
        - name
        - email
        - propertyName
        - address
        - propertyType
        - deliveryStatus
        - submittedAt
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        propertyName: { type: string }
        address: { type: string }
        propertyType: { type: string }
        message: { type: ["string", "null"] }
        deliveryStatus:
          type: string
          enum: [pending, accepted, failed, delivered, bounced, complained]
        providerMessageId: { type: ["string", "null"] }
        providerEventName: { type: ["string", "null"] }
        providerEventAt: { type: ["string", "null"] }
        submittedAt: { type: string }
        deliveryAttemptedAt: { type: ["string", "null"] }
    HostAccountResponse:
      type: object
      required: [account]
      properties:
        account:
          oneOf:
            - $ref: "#/components/schemas/HostAccount"
            - type: "null"
    HostAccount:
      type: object
      required: [email, hasPassword, lastLoginAt, createdAt, inviteHistory]
      properties:
        email: { type: string }
        hasPassword: { type: boolean }
        lastLoginAt: { type: ["string", "null"] }
        createdAt: { type: string }
        inviteHistory:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/HostInviteDelivery"
    HostInviteDelivery:
      type: object
      required: [createdAt, invalidatedAt, usedAt, deliveryStatus, providerMessageId, providerEventName, providerEventAt, deliveryAttemptedAt]
      properties:
        createdAt: { type: string }
        invalidatedAt: { type: ["string", "null"] }
        usedAt: { type: ["string", "null"] }
        deliveryStatus:
          type: string
          enum: [pending, accepted, failed, delivered, bounced, complained]
        providerMessageId: { type: ["string", "null"] }
        providerEventName: { type: ["string", "null"] }
        providerEventAt: { type: ["string", "null"] }
        deliveryAttemptedAt: { type: ["string", "null"] }
    HealthStatus:
      type: object
      properties:
        status: { type: string }
      required: [status]
    OkStatus:
      type: object
      properties:
        ok: { type: boolean }
      required: [ok]
    TrashCategory:
      type: object
      properties:
        id: { type: string }
        label: { type: string }
        sectionTitle: { type: string }
        deletedAt: { type: ["string", "null"] }
      required: [id, label, sectionTitle, deletedAt]
    TrashItem:
      type: object
      properties:
        id: { type: string }
        title: { type: ["string", "null"] }
        categoryLabel: { type: string }
        deletedAt: { type: ["string", "null"] }
      required: [id, title, categoryLabel, deletedAt]
    TrashResponse:
      type: object
      properties:
        categories:
          type: array
          items:
            $ref: "#/components/schemas/TrashCategory"
        items:
          type: array
          items:
            $ref: "#/components/schemas/TrashItem"
        retentionDays: { type: number }
      required: [categories, items, retentionDays]
    SlugCheckResponse:
      type: object
      properties:
        slug: { type: string }
        available: { type: boolean }
        reason: { type: ["string", "null"] }
      required: [slug, available, reason]
    WebAuthnOptions:
      type: object
      properties:
        challengeId: { type: string }
        options:
          type: object
          additionalProperties: true
      required: [challengeId, options]
    WebAuthnVerifyBody:
      type: object
      properties:
        challengeId: { type: string }
        response:
          type: object
          additionalProperties: true
