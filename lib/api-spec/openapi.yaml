        longitude:
          type: ["number", "null"]
          description: Approved POI longitude from the distance review; null until a proposal is approved
        resolvedAddress:
          type: ["string", "null"]
          description: Resolved address from the approved distance review; feeds the named Maps place search, null until a proposal is approved
        media:
          type: array
          items:
            $ref: "#/components/schemas/MediaEntry"
      required: [id, categoryId, open24, bullets, position, isVisible, orderEnabled, soldOut, media]
    ItemInput:
