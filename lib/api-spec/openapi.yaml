  /public/tenants/{slug}/orders:
    post:
      operationId: createOrder
      tags: [orders]
      summary: >
        Place an order for an item that has orderEnabled=true. Validates item
        eligibility, tenant published state, phone containing at least six digit
        characters, rate limits, and idempotency. Sends a notification email to
        the tenant only when the tenant's orderNotifyEmail setting is enabled.
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
        - name: x-device-token
          in: header
          required: true
          schema: { type: string, minLength: 16, maxLength: 256 }
          description: Raw device token (opaque, 16-256 chars); hashed server-side, never stored raw
        - name: x-idempotency-key
          in: header
          required: true
          schema: { type: string, minLength: 16, maxLength: 128 }
          description: Required (16-128 chars); unique per order intent; prevents duplicate submissions on retry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
      responses:
        "200":
          description: >
            Idempotent retry of an already accepted order. Returns the existing
            canonical order unchanged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderPublic"
        "201":
          description: Order placed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderPublic"
        "400":
          description: Validation error (item not orderable, sold out, phone has fewer than six digits, etc.)
        "422":
          description: >
            Email notification rejected or sender not configured. A retryable hidden
            order record may persist internally but is not accepted or visible in any
            list until the notification email sends successfully. Retry with the same
            idempotency key to reattempt delivery.
        "425":
          description: >
            Order is currently being processed by another in-flight request (fresh
            pending notification). Retry with the same idempotency key after a
            short delay (suggest 3-5 seconds).
        "429":
          description: Rate limit exceeded
    get:
      operationId: listDeviceOrders
      tags: [orders]
      summary: >
        List orders for the calling device (identified by hashed device token).
        Returns only orders for this tenant and this device — no cross-device data.
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
        - name: x-device-token
          in: header
          required: true
          schema: { type: string }
          description: Raw device token; hashed server-side to look up orders
      responses:
        "200":
          description: Orders for this device and tenant
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrderPublic"
        "400":
          description: Missing device token
  /admin/tenants/{id}/orders:
    get:
      operationId: listTenantOrders
      tags: [orders]
      summary: >
        List all orders for a tenant (admin, newest first).
        Optional query param: ?status=novo|potrjeno|prevzeto|zavrnjeno
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Orders list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrderAdmin"
        "401":
          description: Not authenticated
        "404":
          description: Tenant not found
  /admin/orders/{orderRef}/status:
    patch:
      operationId: updateOrderStatus
      tags: [orders]
      summary: >
        Transition an order status. Allowed transitions:
        novo→potrjeno, novo→zavrnjeno, potrjeno→prevzeto, potrjeno→zavrnjeno.
        Terminal statuses (prevzeto, zavrnjeno) cannot change.
      parameters:
        - name: orderRef
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderStatusUpdate"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderAdmin"
        "400":
          description: Invalid transition
        "401":
          description: Not authenticated
        "404":
          description: Order not found
  /public/tenants/{slug}/messages:
    get:
      operationId: getGuestMessages
      tags: [messages]
      summary: >
        Fetch the active thread and messages for this device.
        Returns only the thread owned by this device token for this tenant.
        Returns 204 when no thread exists yet.
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
        - name: x-device-token
          in: header
          required: true
          schema: { type: string, minLength: 16, maxLength: 256 }
          description: Raw device token; hashed server-side, never stored raw
      responses:
        "200":
          description: Thread with messages for this device
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestThreadView"
        "204":
          description: No thread exists for this device yet
        "400":
          description: Missing or invalid device token
        "404":
          description: Tenant not found
    post:
      operationId: sendGuestMessage
      tags: [messages]
      summary: >
        Send a message as a signed-in guest. A nonblank name and unit are always
        required; the tenant password is also required when configured. Creates
        the thread on first message (one durable thread per tenant + device). All
        attempts, including failed credential checks, count toward the 5/min
        per-IP and 5/min per-device limits.
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
        - name: x-device-token
          in: header
          required: true
          schema: { type: string, minLength: 16, maxLength: 256 }
          description: Raw device token; hashed server-side, never stored raw
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuestMessageInput"
      responses:
        "201":
          description: Message sent; returns the updated thread view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestThreadView"
        "400":
          description: Validation error (body too long, blank, etc.)
        "403":
          description: Invalid guest password
        "404":
          description: Tenant not found or not published
        "409":
          description: Thread is closed — no new guest messages accepted
        "429":
          description: Rate limit exceeded (5/min per IP or per device)
  /admin/tenants/{tenantId}/messages:
    get:
      operationId: listTenantThreads
      tags: [messages]
      summary: List all message threads for a tenant (admin, newest-activity first).
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Thread list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminThreadView"
        "401":
          description: Not authenticated
        "404":
          description: Tenant not found
  /admin/tenants/{tenantId}/messages/{threadRef}:
    post:
      operationId: postHostReply
      tags: [messages]
      summary: Post a host reply into a thread.
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: { type: string }
        - name: threadRef
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HostReplyInput"
      responses:
        "201":
          description: Reply posted; returns updated admin thread view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminThreadView"
        "400":
          description: Validation error
        "401":
          description: Not authenticated
        "404":
          description: Thread or tenant not found
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status: { type: string }
      required: [status]
    OkStatus:
      type: object
      properties:
        ok: { type: boolean }
      required: [ok]
    TrashCategory:
      type: object
      properties:
        id: { type: string }
        label: { type: string }
        sectionTitle: { type: string }
        deletedAt: { type: ["string", "null"] }
      required: [id, label, sectionTitle, deletedAt]
    TrashItem:
      type: object
      properties:
        id: { type: string }
        title: { type: ["string", "null"] }
        categoryLabel: { type: string }
        deletedAt: { type: ["string", "null"] }
      required: [id, title, categoryLabel, deletedAt]
    TrashResponse:
      type: object
      properties:
        categories:
          type: array
          items:
            $ref: "#/components/schemas/TrashCategory"
        items:
          type: array
          items:
            $ref: "#/components/schemas/TrashItem"
        retentionDays: { type: number }
      required: [categories, items, retentionDays]
    SlugCheckResponse:
      type: object
      properties:
        slug: { type: string }
        available: { type: boolean }
        reason: { type: ["string", "null"] }
      required: [slug, available, reason]
    WebAuthnOptions:
      type: object
      properties:
        challengeId: { type: string }
        options:
          type: object
          additionalProperties: true
      required: [challengeId, options]
    WebAuthnVerifyBody:
      type: object
      properties:
        challengeId: { type: string }
        response:
          type: object
          additionalProperties: true
      required: [challengeId, response]
    EnrollOptionsBody:
      type: object
      properties:
        token: { type: string }
      required: [token]
    EnrollVerifyBody:
      type: object
      properties:
        token: { type: string }
        challengeId: { type: string }
        deviceName: { type: string }
        response:
          type: object
          additionalProperties: true
      required: [token, challengeId, response]
    EnrollResult:
      type: object
      properties:
        ok: { type: boolean }
        recoveryCodes:
          type: array
          items: { type: string }
      required: [ok]
    RecoveryBody:
      type: object
      properties:
        code: { type: string }
      required: [code]
    RecoveryResult:
      type: object
      properties:
        enrollToken: { type: string }
      required: [enrollToken]
    Passkey:
      type: object
      properties:
        id: { type: string }
        deviceName: { type: string }
        createdAt: { type: string }
        lastUsedAt: { type: ["string", "null"] }
      required: [id, deviceName, createdAt, lastUsedAt]
    PasskeyList:
      type: object
      properties:
        credentials:
          type: array
          items:
            $ref: "#/components/schemas/Passkey"
        unusedRecoveryCodes: { type: number }
      required: [credentials, unusedRecoveryCodes]
    RenamePasskeyRequest:
      type: object
      properties:
        deviceName: { type: string }
      required: [deviceName]
    AddPasskeyVerifyBody:
      type: object
      properties:
        challengeId: { type: string }
        deviceName: { type: string }
        response:
          type: object
          additionalProperties: true
      required: [challengeId, response]
    AdminSession:
      type: object
      properties:
        authenticated: { type: boolean }
      required: [authenticated]
    RecoveryCodeStatus:
      type: object
      properties:
        active: { type: number }
        consumed: { type: number }
      required: [active, consumed]
    RecoveryCodesRotated:
      type: object
      properties:
        recoveryCodes:
          type: array
          items: { type: string }
      required: [recoveryCodes]
    AuthEvent:
      type: object
      properties:
        id: { type: string }
        type: { type: string }
        detail: { type: ["string", "null"] }
        ip: { type: ["string", "null"] }
        createdAt: { type: string }
      required: [id, type, detail, ip, createdAt]
    AuthEventList:
      type: object
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/AuthEvent"
      required: [events]
    DistanceRunInput:
      type: object
      properties:
        limit: { type: number, minimum: 1, maximum: 100 }
        retryFailed: { type: boolean }
    DistanceBulkApproveInput:
      type: object
      properties: { confidence: { type: string, enum: [high] } }
      required: [confidence]
    DistanceValueInput:
      type: object
      properties: { distanceMeters: { type: number, minimum: 0 } }
      required: [distanceMeters]
    DistanceLinkInput:
      type: object
      properties: { mapUrl: { type: string } }
      required: [mapUrl]
    DistanceReviewRow:
      type: object
      properties:
        id: { type: ["string", "null"] }
        itemId: { type: string }
        itemTitle: { type: ["string", "null"] }
        categoryLabel: { type: string }
        status: { type: string, enum: [new, pending, approved, skipped, failed, manual] }
        source: { type: ["string", "null"] }
        confidence: { type: ["string", "null"] }
        latitude: { type: ["number", "null"] }
        longitude: { type: ["number", "null"] }
        distanceMeters: { type: ["number", "null"] }
        durationMinutes: { type: ["number", "null"] }
        resolvedAddress: { type: ["string", "null"] }
        error: { type: ["string", "null"] }
