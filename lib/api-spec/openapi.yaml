openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Smart360 API - multi-tenant guest information PWA
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: public
  - name: auth
  - name: tenants
  - name: sections
  - name: categories
  - name: items
  - name: media
  - name: translations
  - name: overview
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /public/tenants/{slug}:
    get:
      operationId: getPublicTenant
      tags: [public]
      summary: Full published content tree for a tenant (guest view)
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
        - name: lang
          in: query
          required: false
          schema: { type: string }
        - name: preview
          in: query
          required: false
          schema: { type: boolean }
      responses:
        "200":
          description: Tenant content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantContent"
        "404":
          description: Not found or unpublished
  /public/tenants/{slug}/search:
    get:
      operationId: searchPublicTenant
      tags: [public]
      summary: Full-text search across a tenant's visible content
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
        - name: q
          in: query
          required: true
          schema: { type: string }
        - name: lang
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SearchResult"
  /admin/webauthn/login/options:
    post:
      operationId: getPasskeyLoginOptions
      tags: [auth]
      responses:
        "200":
          description: WebAuthn authentication options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebAuthnOptions"
        "429":
          description: Too many attempts
  /admin/webauthn/login/verify:
    post:
      operationId: verifyPasskeyLogin
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebAuthnVerifyBody"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
        "401":
          description: Verification failed
        "429":
          description: Too many attempts
  /admin/enroll/options:
    post:
      operationId: getEnrollOptions
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrollOptionsBody"
      responses:
        "200":
          description: WebAuthn registration options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebAuthnOptions"
        "400":
          description: Invalid or expired token
  /admin/enroll/verify:
    post:
      operationId: verifyEnroll
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrollVerifyBody"
      responses:
        "200":
          description: Passkey registered; recovery codes when first enrolment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollResult"
        "400":
          description: Invalid request
  /admin/recovery:
    post:
      operationId: useRecoveryCode
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecoveryBody"
      responses:
        "200":
          description: Enrolment token issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryResult"
        "401":
          description: Invalid code
        "429":
          description: Too many attempts
  /admin/credentials:
    get:
      operationId: listPasskeys
      tags: [auth]
      responses:
        "200":
          description: Registered passkeys
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasskeyList"
        "401":
          description: Not authenticated
  /admin/credentials/{id}:
    patch:
      operationId: renamePasskey
      tags: [auth]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenamePasskeyRequest"
      responses:
        "200":
          description: Renamed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkStatus"
        "404":
          description: Not found
    delete:
      operationId: deletePasskey
      tags: [auth]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkStatus"
        "400":
          description: Cannot delete the last credential
        "404":
          description: Not found
  /admin/credentials/options:
    post:
      operationId: getAddPasskeyOptions
      tags: [auth]
      responses:
        "200":
          description: WebAuthn registration options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebAuthnOptions"
        "401":
          description: Not authenticated
  /admin/credentials/verify:
    post:
      operationId: verifyAddPasskey
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddPasskeyVerifyBody"
      responses:
        "200":
          description: Passkey added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkStatus"
        "400":
          description: Invalid request
  /admin/sessions/revoke-all:
    post:
      operationId: revokeAllSessions
      tags: [auth]
      responses:
        "200":
          description: All sessions revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkStatus"
        "401":
          description: Not authenticated
  /admin/recovery-codes:
    get:
      operationId: getRecoveryCodeStatus
      tags: [auth]
      responses:
        "200":
          description: Recovery code counts (never the values)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryCodeStatus"
        "401":
          description: Not authenticated
  /admin/recovery-codes/rotate:
    post:
      operationId: rotateRecoveryCodes
      tags: [auth]
      responses:
        "200":
          description: Fresh set of recovery codes, shown exactly once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryCodesRotated"
        "401":
          description: Not authenticated
  /admin/auth-events:
    get:
      operationId: listAuthEvents
      tags: [auth]
      responses:
        "200":
          description: Recent authentication audit events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthEventList"
        "401":
          description: Not authenticated
  /admin/logout:
    post:
      operationId: adminLogout
      tags: [auth]
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
  /admin/session:
    get:
      operationId: getAdminSession
      tags: [auth]
      responses:
        "200":
          description: Session state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
  /admin/overview:
    get:
      operationId: getAdminOverview
      tags: [overview]
      summary: Dashboard counts and recent changes
      responses:
        "200":
          description: Overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOverview"
  /admin/tenants:
    get:
      operationId: listTenants
      tags: [tenants]
      responses:
        "200":
          description: Tenants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tenant"
    post:
      operationId: createTenant
      tags: [tenants]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
  /admin/tenants/{id}:
    get:
      operationId: getTenant
      tags: [tenants]
      summary: Tenant with full content tree
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Tenant content tree
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantContent"
        "404":
          description: Not found
    patch:
      operationId: updateTenant
      tags: [tenants]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
    delete:
      operationId: deleteTenant
      tags: [tenants]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted
  /admin/tenants/{id}/duplicate:
    post:
      operationId: duplicateTenant
      tags: [tenants]
      summary: Duplicate a tenant with its full section/category tree
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantDuplicateInput"
      responses:
        "201":
          description: Duplicated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
  /admin/tenants/{id}/sections:
    post:
      operationId: createSection
      tags: [sections]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SectionInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Section"
  /admin/sections/{id}:
    patch:
      operationId: updateSection
      tags: [sections]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SectionUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Section"
    delete:
      operationId: deleteSection
      tags: [sections]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted
  /admin/sections/reorder:
    post:
      operationId: reorderSections
      tags: [sections]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderInput"
      responses:
        "200":
          description: Reordered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkStatus"
  /admin/sections/{id}/categories:
    post:
      operationId: createCategory
      tags: [categories]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
  /admin/categories/{id}:
    patch:
      operationId: updateCategory
      tags: [categories]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
    delete:
      operationId: deleteCategory
      tags: [categories]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted
  /admin/categories/reorder:
    post:
      operationId: reorderCategories
      tags: [categories]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderInput"
      responses:
        "200":
          description: Reordered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkStatus"
  /admin/categories/{id}/items:
    post:
      operationId: createItem
      tags: [items]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
  /admin/items/{id}:
    patch:
      operationId: updateItem
      tags: [items]
      summary: Update an item; pass categoryId to move it to another category
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
    delete:
      operationId: deleteItem
      tags: [items]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted
  /admin/items/{id}/duplicate:
    post:
      operationId: duplicateItem
      tags: [items]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "201":
          description: Duplicated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
  /admin/items/reorder:
    post:
      operationId: reorderItems
      tags: [items]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderInput"
      responses:
        "200":
          description: Reordered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkStatus"
  /admin/items/{id}/media:
    post:
      operationId: addItemMedia
      tags: [media]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaInput"
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaEntry"
  /admin/storage/usage:
    get:
      operationId: getStorageUsage
      tags: [media]
      description: >
        Object-storage usage per tenant (sum of stored media object sizes),
        largest first, plus the total across all tenants. Values refresh at
        most every few minutes (server-side cache).
      responses:
        "200":
          description: Usage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageUsage"
  /admin/storage/cleanup:
    get:
      operationId: getStorageCleanupPreview
      tags: [media]
      description: >
        DRY RUN of the explicit storage cleanup — lists files no DB row
        references any more (across ALL tenants, so duplicated tenants keep
        each other's files alive) without touching anything. scope=tenant
        needs tenantId and scans that tenant's slug prefixes; scope=orphans
        scans prefixes belonging to no live tenant.
      parameters:
        - name: scope
          in: query
          required: true
          schema: { type: string, enum: [tenant, orphans] }
        - name: tenantId
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: What would be removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageCleanupPreview"
    post:
      operationId: runStorageCleanup
      tags: [media]
      description: >
        Execute the cleanup for the same scope. References are re-computed at
        execution time; files that gained a reference since the preview are
        skipped. Never runs on a schedule — admin-confirmed only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StorageCleanupRequest"
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageCleanupResult"
  # NOTE: POST /admin/items/{id}/media/upload (multipart photo/video upload)
  # intentionally lives OUTSIDE this contract: orval's zod output emits
  # File/Blob types for format:binary, which do not exist in the node lib
  # config. The admin UI calls it with raw XHR (progress events).
  /admin/media/{id}:
    delete:
      operationId: deleteMedia
      tags: [media]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted
  /admin/media/reorder:
    post:
      operationId: reorderMedia
      tags: [media]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderInput"
      responses:
        "200":
          description: Reordered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkStatus"
  /admin/translations:
    get:
      operationId: listTranslations
      tags: [translations]
      parameters:
        - name: model
          in: query
          required: true
          schema: { type: string }
        - name: recordId
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Translations for a record
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Translation"
    put:
      operationId: upsertTranslation
      tags: [translations]
      summary: Create/update a translation; empty value deletes it
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TranslationInput"
      responses:
        "200":
          description: Upserted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkStatus"
  /admin/tenants/{id}/trash:
    get:
      operationId: getTrash
      tags: [content]
      summary: Recently deleted categories and items (30-day trash)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Trash contents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrashResponse"
  /admin/categories/{id}/restore:
    post:
      operationId: restoreCategory
      tags: [content]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Restored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkStatus"
  /admin/items/{id}/restore:
    post:
      operationId: restoreItem
      tags: [content]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Restored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkStatus"
  /admin/categories/{id}/purge:
    delete:
      operationId: purgeCategory
      tags: [content]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Permanently deleted
  /admin/items/{id}/purge:
    delete:
      operationId: purgeItem
      tags: [content]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Permanently deleted
  /admin/slug-check:
    get:
      operationId: checkSlug
      tags: [tenants]
      summary: Live slug availability check for the settings screen
      parameters:
        - name: slug
          in: query
          required: true
          schema: { type: string }
        - name: tenantId
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Availability verdict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SlugCheckResponse"
  /admin/tenants/{id}/qr.png:
    get:
      operationId: getTenantQr
      tags: [tenants]
      summary: QR code PNG pointing to the tenant's guest address
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: PNG image
          content:
            image/png:
              schema:
                type: string
                format: binary
  /admin/tenants/{id}/label.pdf:
    get:
      operationId: getTenantLabelPdf
      tags: [tenants]
      summary: Printable A6 label PDF (wordmark, QR, name, bilingual caption, address)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: PDF document
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "404":
          description: Not found
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status: { type: string }
      required: [status]
    OkStatus:
      type: object
      properties:
        ok: { type: boolean }
      required: [ok]
    TrashCategory:
      type: object
      properties:
        id: { type: string }
        label: { type: string }
        sectionTitle: { type: string }
        deletedAt: { type: ["string", "null"] }
      required: [id, label, sectionTitle, deletedAt]
    TrashItem:
      type: object
      properties:
        id: { type: string }
        title: { type: ["string", "null"] }
        categoryLabel: { type: string }
        deletedAt: { type: ["string", "null"] }
      required: [id, title, categoryLabel, deletedAt]
    TrashResponse:
      type: object
      properties:
        categories:
          type: array
          items:
            $ref: "#/components/schemas/TrashCategory"
        items:
          type: array
          items:
            $ref: "#/components/schemas/TrashItem"
        retentionDays: { type: number }
      required: [categories, items, retentionDays]
    SlugCheckResponse:
      type: object
      properties:
        slug: { type: string }
        available: { type: boolean }
        reason: { type: ["string", "null"] }
      required: [slug, available, reason]
    WebAuthnOptions:
      type: object
      properties:
        challengeId: { type: string }
        options:
          type: object
          additionalProperties: true
      required: [challengeId, options]
    WebAuthnVerifyBody:
      type: object
      properties:
        challengeId: { type: string }
        response:
          type: object
          additionalProperties: true
      required: [challengeId, response]
    EnrollOptionsBody:
      type: object
      properties:
        token: { type: string }
      required: [token]
    EnrollVerifyBody:
      type: object
      properties:
        token: { type: string }
        challengeId: { type: string }
