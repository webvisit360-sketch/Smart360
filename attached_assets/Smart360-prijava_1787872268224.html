<!doctype html><html lang="sl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Smart360 — prijava</title>
<style>
@font-face{font-family:Archivo;src:url('file:///home/claude/smart360/logo/font/Archivo-VariableFont_wdth,wght.ttf') format('truetype');font-weight:100 900;font-display:swap}
:root{
  --bg:#FFFFFF;--card:#F4F6F2;--tx:#121A14;--tx2:#66716A;--line:#E8EBE6;
  --acc:#157347;--accg:#1D9159;--warm:#DD9A2B;--danger:#D93A2B;
  --sans:Archivo,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font:16px/1.55 var(--sans);color:var(--tx);background:var(--card);
  min-height:100vh;display:grid;place-items:center;padding:32px 20px;
  -webkit-font-smoothing:antialiased;position:relative;overflow-x:hidden}

/* mavrični kolobar v ozadju — tiho, kot na spletni strani */
.bgring{position:fixed;pointer-events:none;opacity:.20;z-index:0}
.bgring svg{width:100%;height:auto;display:block}
.bgring.a{width:min(520px,74vw);right:-18%;top:-22%}
.bgring.b{display:none}

.card{position:relative;z-index:1;width:100%;max-width:420px;background:var(--bg);
  border:1px solid var(--line);border-radius:28px;padding:38px 34px 30px;
  box-shadow:0 24px 60px rgba(18,26,20,.07)}

.brand{display:flex;flex-direction:column;align-items:center;gap:14px;margin-bottom:6px}
.brand .lk{width:204px}
.brand .lk svg{width:100%;height:auto;display:block}
.card h1{font-size:20px;font-weight:800;letter-spacing:-.02em;text-align:center;margin-top:16px}
.card .sub{text-align:center;color:var(--tx2);font-size:15px;margin:5px 0 26px}

.f{margin-bottom:16px}
.f label{display:block;font-size:12.5px;font-weight:800;letter-spacing:.11em;
  text-transform:uppercase;color:var(--tx2);margin-bottom:7px}
.f input{width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:14px;
  padding:14px 16px;font:600 16px var(--sans);color:var(--tx);outline:none;
  transition:border-color .15s}
.f input::placeholder{color:#A9B2A8;font-weight:500}
.f input:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(21,115,71,.10)}

.btn{width:100%;border:0;border-radius:14px;padding:15px 20px;
  font:800 16px var(--sans);cursor:pointer;display:inline-flex;align-items:center;
  justify-content:center;gap:9px;transition:transform .12s,background .15s}
.btn:active{transform:scale(.985)}
.btn--p{background:var(--acc);color:#fff}
.btn--p:hover{background:#12643D}
.btn svg{width:18px;height:18px;flex:none}

.link{display:block;text-align:center;margin-top:16px;font-size:15px;font-weight:700;
  color:var(--acc);text-decoration:none}
.link:hover{text-decoration:underline}

.sep{display:flex;align-items:center;gap:14px;margin:28px 0 18px;
  font-size:11.5px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:#9AA69E}
.sep:before,.sep:after{content:"";flex:1;height:1px;background:var(--line)}

.team{display:flex;flex-direction:column;align-items:center;gap:10px}
.team a{font-size:14.5px;font-weight:700;color:var(--tx2);text-decoration:none;
  border:1px solid var(--line);border-radius:12px;padding:11px 18px;background:var(--card)}
.team a:hover{color:var(--tx);border-color:#D6DDD4}
.team small{font-size:13px;color:#9AA69E}
.team small a{border:0;padding:0;background:none;font-size:13px;font-weight:700;color:var(--tx2)}

.foot{position:relative;z-index:1;margin-top:22px;text-align:center;
  font-size:13px;color:#8B958A}
.foot a{color:#8B958A;text-decoration:none;font-weight:650}
.foot a:hover{color:var(--tx2);text-decoration:underline}

@media(max-width:420px){
  .card{padding:30px 22px 26px;border-radius:24px}
  .brand .lk{width:172px}
}
</style></head>
