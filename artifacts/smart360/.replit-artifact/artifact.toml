kind = "web"
previewPath = "/"
title = "Smart360"
description = "Multi-tenant guest information PWA for tourist accommodations. Guests scan a QR code and see everything about their stay (welcome, WiFi, house rules, equipment guides, check-in/out) and the surroundings (restaurants, beaches, trails, services). Includes a single-operator admin for managing tenants, sections, categories, items and translations."
version = "1.0.0"
id = "artifacts/smart360"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 26044

[services.development]
run = "pnpm --filter @workspace/smart360 run dev"

[services.production]

[services.production.build]
args = [ "pnpm", "--filter", "@workspace/smart360", "run", "build" ]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
# self-owned static server so cache headers are correct:
# hashed assets immutable, index.html no-cache, version.json no-store
args = [ "node", "artifacts/smart360/server.mjs" ]

[services.production.run.env]
PORT = "26044"
NODE_ENV = "production"

[services.production.health.startup]
path = "/healthz"

[services.env]
PORT = "26044"
BASE_PATH = "/"
